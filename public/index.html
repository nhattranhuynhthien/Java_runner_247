<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Rồng Online • 24/7 Cloud</title>
    <!-- Preload core RFB scripts -->
    <link rel="modulepreload" href="./core/rfb.js">
    <link rel="modulepreload" href="./core/display.js">
    <link rel="modulepreload" href="./core/websock.js">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #05070d;
            overflow: hidden;
            touch-action: manipulation;
        }
        #screen-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070d;
        }
        #screen {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }
        #screen canvas {
            max-width: 100vw;
            max-height: calc(100vh - 48px);
            object-fit: contain;
            aspect-ratio: 480 / 640;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-ctrl {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            transition: all 0.08s ease;
            cursor: pointer;
        }
        .btn-ctrl:active {
            background: #4f46e5;
            color: #ffffff;
            transform: scale(0.92);
            border-color: #818cf8;
        }
        .noVNC_vcenter, #noVNC_control_bar_anchor, #noVNC_control_bar {
            display: none !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none text-slate-100">

    <!-- Top Navbar -->
    <header class="h-12 bg-slate-950/95 backdrop-blur-md border-b border-white/5 px-2.5 sm:px-4 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/25 text-white text-xs font-bold">
                🐉
            </div>
            <div class="flex items-center gap-2">
                <span class="font-bold text-xs sm:text-sm text-slate-100 tracking-tight">Ngọc Rồng 24/7</span>
                <span id="status-pill" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] sm:text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="status-label">Đang chạy</span>
                </span>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Quick Action: Bấm OK / Bỏ Báo Mất Sóng -->
            <button id="btn-quick-dismiss" class="h-8 px-2.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 active:scale-95 border border-emerald-500/30 text-xs font-bold text-emerald-300 flex items-center gap-1.5 transition" title="Bấm OK bỏ qua thông báo mất sóng / xác nhận">
                <i class="fa-solid fa-circle-check"></i>
                <span>Bấm OK</span>
            </button>

            <!-- Upload / Switch Mod Button -->
            <button id="btn-open-upload" class="h-8 px-2.5 rounded-lg bg-indigo-500/20 hover:bg-indigo-500/30 active:scale-95 border border-indigo-500/30 text-xs font-semibold text-indigo-300 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span class="hidden sm:inline">Đổi Mod</span>
            </button>

            <!-- Virtual Keypad Toggle -->
            <button id="btn-toggle-pad" class="h-8 px-2.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 active:scale-95 border border-amber-500/30 text-xs font-semibold text-amber-300 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-gamepad"></i>
                <span class="hidden sm:inline">Phím ảo</span>
            </button>

            <!-- Fullscreen Toggle -->
            <button id="btn-fullscreen" class="h-8 w-8 rounded-lg bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 text-xs text-slate-300 flex items-center justify-center transition" title="Toàn màn hình">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- UptimeRobot Keep-Alive Badge -->
            <a href="/health" target="_blank" class="h-8 px-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-xs font-medium text-rose-400 flex items-center gap-1 transition" title="Link UptimeRobot">
                <i class="fa-solid fa-heart-pulse"></i>
            </a>
        </div>
    </header>

    <!-- Main Game Canvas Area -->
    <main class="relative flex-1 bg-[#05070d] flex items-center justify-center overflow-hidden" id="main-area">
        <div id="screen-wrapper">
            <div id="screen"></div>
        </div>

        <!-- Fast Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#05070d] flex flex-col items-center justify-center gap-3 z-50 transition-opacity duration-150">
            <div class="relative w-11 h-11">
                <div class="w-11 h-11 rounded-full border-2 border-amber-500/20 border-t-amber-400 animate-spin"></div>
                <span class="absolute inset-0 flex items-center justify-center text-sm">🐉</span>
            </div>
            <p class="text-xs font-medium text-slate-300" id="loading-text">Đang kết nối vào màn hình game...</p>
        </div>

        <!-- Floating Mobile Keypad -->
        <div id="gamepad-drawer" class="absolute bottom-3 right-3 bg-slate-950/95 backdrop-blur-xl p-2.5 rounded-2xl border border-white/10 shadow-2xl z-40 max-w-[260px] select-none">
            <div class="flex items-center justify-between pb-1.5 mb-2 border-b border-white/10 text-[11px] font-semibold text-slate-400">
                <span class="flex items-center gap-1.5 text-amber-400">
                    <i class="fa-solid fa-keyboard"></i>
                    <span>Bàn phím J2ME</span>
                </span>
                <button id="btn-close-pad" class="text-slate-400 hover:text-white p-0.5">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Direction & Softkeys -->
            <div class="grid grid-cols-3 gap-1.5 mb-1.5 text-xs">
                <button class="btn-ctrl h-9 text-[11px]" data-key="SoftLeft">Chọn Trái</button>
                <button class="btn-ctrl h-9" data-key="ArrowUp"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="btn-ctrl h-9 text-[11px]" data-key="SoftRight">Chọn Phải</button>

                <button class="btn-ctrl h-9" data-key="ArrowLeft"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="btn-ctrl h-9 bg-indigo-600 border-indigo-500 font-bold text-white text-sm" data-key="Enter">OK</button>
                <button class="btn-ctrl h-9" data-key="ArrowRight"><i class="fa-solid fa-arrow-right"></i></button>

                <div></div>
                <button class="btn-ctrl h-9" data-key="ArrowDown"><i class="fa-solid fa-arrow-down"></i></button>
                <div></div>
            </div>

            <!-- Number Keypad (1 - 9, *, 0, #) -->
            <div class="grid grid-cols-3 gap-1.5 text-xs">
                <button class="btn-ctrl h-8" data-key="1">1</button>
                <button class="btn-ctrl h-8" data-key="2">2</button>
                <button class="btn-ctrl h-8" data-key="3">3</button>
                <button class="btn-ctrl h-8" data-key="4">4</button>
                <button class="btn-ctrl h-8" data-key="5">5</button>
                <button class="btn-ctrl h-8" data-key="6">6</button>
                <button class="btn-ctrl h-8" data-key="7">7</button>
                <button class="btn-ctrl h-8" data-key="8">8</button>
                <button class="btn-ctrl h-8" data-key="9">9</button>
                <button class="btn-ctrl h-8 font-bold text-amber-400" data-key="*">*</button>
                <button class="btn-ctrl h-8" data-key="0">0</button>
                <button class="btn-ctrl h-8 font-bold text-amber-400" data-key="#">#</button>
            </div>
        </div>
    </main>

    <!-- MODAL: Đổi File Game / Bản Mod (.JAR) Trực tiếp trên Web -->
    <div id="modal-upload" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i>
                    <h3 class="font-bold text-sm text-white">Đổi File Game / Mod (.JAR)</h3>
                </div>
                <button id="btn-close-upload" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex items-center justify-between">
                    <span class="text-slate-400">File đang chạy:</span>
                    <span id="label-current-game" class="font-mono text-amber-300 font-semibold truncate max-w-[170px]">Đang tải...</span>
                </div>

                <div>
                    <label class="block text-slate-300 font-medium mb-1.5">Chọn file .jar mới từ máy hoặc điện thoại:</label>
                    <input type="file" id="input-game-file" accept=".jar" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-950 border border-slate-800 rounded-lg p-1.5">
                </div>

                <div id="upload-status" class="hidden text-center py-1 text-xs"></div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button id="btn-cancel-upload" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium">Hủy</button>
                <button id="btn-submit-upload" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-play text-[10px]"></i>
                    <span>Tải Lên & Chạy Ngay</span>
                </button>
            </div>
        </div>
    </div>

    <!-- RFB Core Library Script -->
    <script type="module">
        import RFB from './core/rfb.js';

        let rfb = null;
        const screenElem = document.getElementById('screen');
        const screenWrapper = document.getElementById('screen-wrapper');
        const statusPill = document.getElementById('status-pill');
        const statusLabel = document.getElementById('status-label');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const port = window.location.port ? `:${window.location.port}` : '';
            const path = 'websockify';
            const url = `${protocol}://${window.location.hostname}${port}/${path}`;

            try {
                rfb = new RFB(screenElem, url, {
                    credentials: { password: '' }
                });

                rfb.scaleViewport = true;
                rfb.resizeSession = false;
                rfb.compressionLevel = 0;
                rfb.qualityLevel = 7;

                rfb.addEventListener('connect', () => {
                    loadingOverlay.style.display = 'none';
                    statusPill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] sm:text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                    statusLabel.textContent = 'Đang chạy';

                    if (rfb.focus) rfb.focus();
                });

                rfb.addEventListener('disconnect', () => {
                    loadingOverlay.style.display = 'flex';
                    loadingText.textContent = 'Đang kết nối lại tức thì...';
                    statusPill.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] sm:text-[11px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20';
                    statusLabel.textContent = 'Đang nạp';
                    setTimeout(connect, 1000);
                });

            } catch (err) {
                loadingText.textContent = 'Lỗi kết nối: ' + err.message;
                setTimeout(connect, 2000);
            }
        }

        connect();

        // 1. Dual-channel key sender (RFB VNC + Direct Backend X11 Injection)
        function sendKeyPulse(keysym, code, keyName) {
            // Channel A: noVNC sendKey
            if (rfb) {
                try {
                    rfb.sendKey(keysym, code, true);
                    setTimeout(() => rfb.sendKey(keysym, code, false), 50);
                } catch (e) {}
            }

            // Channel B: Server-side xdotool injection (100% foolproof)
            fetch('/api/key?key=' + encodeURIComponent(keyName || code), {
                method: 'POST'
            }).catch(() => {});
        }

        const keyMap = {
            'SoftLeft':  { sym: 0x0071, code: 'KeyQ', xdo: 'SoftLeft' },
            'SoftRight': { sym: 0x0077, code: 'KeyW', xdo: 'SoftRight' },
            'Enter':     { sym: 0xFF0D, code: 'Enter', xdo: 'Return' },
            'ArrowUp':   { sym: 0xFF52, code: 'ArrowUp', xdo: 'ArrowUp' },
            'ArrowDown': { sym: 0xFF54, code: 'ArrowDown', xdo: 'ArrowDown' },
            'ArrowLeft': { sym: 0xFF51, code: 'ArrowLeft', xdo: 'ArrowLeft' },
            'ArrowRight':{ sym: 0xFF53, code: 'ArrowRight', xdo: 'ArrowRight' },
            '1': { sym: 0x0031, code: 'Digit1', xdo: '1' },
            '2': { sym: 0x0032, code: 'Digit2', xdo: '2' },
            '3': { sym: 0x0033, code: 'Digit3', xdo: '3' },
            '4': { sym: 0x0034, code: 'Digit4', xdo: '4' },
            '5': { sym: 0x0035, code: 'Digit5', xdo: '5' },
            '6': { sym: 0x0036, code: 'Digit6', xdo: '6' },
            '7': { sym: 0x0037, code: 'Digit7', xdo: '7' },
            '8': { sym: 0x0038, code: 'Digit8', xdo: '8' },
            '9': { sym: 0x0039, code: 'Digit9', xdo: '9' },
            '0': { sym: 0x0030, code: 'Digit0', xdo: '0' },
            '*': { sym: 0x0065, code: 'KeyE', xdo: '*' },
            '#': { sym: 0x0072, code: 'KeyR', xdo: '#' }
        };

        // Keypad buttons
        document.querySelectorAll('.btn-ctrl').forEach(btn => {
            const handlePress = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const key = btn.getAttribute('data-key');
                const def = keyMap[key];
                if (def) {
                    sendKeyPulse(def.sym, def.code, def.xdo);
                }
            };
            btn.addEventListener('pointerdown', handlePress);
        });

        // Quick Dismiss Button (OK / Dismiss Dialog)
        const btnQuickDismiss = document.getElementById('btn-quick-dismiss');
        btnQuickDismiss.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            sendKeyPulse(0xFF0D, 'Enter', 'Return');
            fetch('/api/dismiss', { method: 'POST' }).catch(() => {});
        });

        // 2. Direct Screen Click & Touch Event Forwarding
        screenWrapper.addEventListener('pointerdown', (e) => {
            if (rfb && rfb.focus) rfb.focus();

            const canvas = screenWrapper.querySelector('canvas');
            if (canvas) {
                const rect = canvas.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    const x = Math.round(((e.clientX - rect.left) / rect.width) * 480);
                    const y = Math.round(((e.clientY - rect.top) / rect.height) * 640);

                    // Send click directly to X11 display
                    fetch('/api/click', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ x, y })
                    }).catch(() => {});
                }
            }
        });

        // 3. Physical Keyboard Support on Desktop
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const codeMap = {
                'Enter': 'Return',
                'Space': 'Space',
                'ArrowUp': 'ArrowUp',
                'ArrowDown': 'ArrowDown',
                'ArrowLeft': 'ArrowLeft',
                'ArrowRight': 'ArrowRight',
                'KeyQ': 'SoftLeft',
                'KeyW': 'SoftRight',
                'Digit0': '0', 'Numpad0': '0',
                'Digit1': '1', 'Numpad1': '1',
                'Digit2': '2', 'Numpad2': '2',
                'Digit3': '3', 'Numpad3': '3',
                'Digit4': '4', 'Numpad4': '4',
                'Digit5': '5', 'Numpad5': '5',
                'Digit6': '6', 'Numpad6': '6',
                'Digit7': '7', 'Numpad7': '7',
                'Digit8': '8', 'Numpad8': '8',
                'Digit9': '9', 'Numpad9': '9',
            };

            const k = codeMap[e.code];
            if (k) {
                const def = keyMap[k] || { sym: 0xFF0D, code: 'Enter', xdo: k };
                sendKeyPulse(def.sym, def.code, def.xdo);
            }
        });

        // Toggle Keypad Drawer
        const btnTogglePad = document.getElementById('btn-toggle-pad');
        const gamepadDrawer = document.getElementById('gamepad-drawer');
        const btnClosePad = document.getElementById('btn-close-pad');

        btnTogglePad.addEventListener('click', (e) => {
            e.stopPropagation();
            gamepadDrawer.classList.toggle('hidden');
        });
        btnClosePad.addEventListener('click', (e) => {
            e.stopPropagation();
            gamepadDrawer.classList.add('hidden');
        });

        // Fullscreen toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        // ==================== UPLOAD MOD MODAL LOGIC ====================
        const btnOpenUpload = document.getElementById('btn-open-upload');
        const modalUpload = document.getElementById('modal-upload');
        const btnCloseUpload = document.getElementById('btn-close-upload');
        const btnCancelUpload = document.getElementById('btn-cancel-upload');
        const btnSubmitUpload = document.getElementById('btn-submit-upload');
        const inputGameFile = document.getElementById('input-game-file');
        const uploadStatus = document.getElementById('upload-status');
        const labelCurrentGame = document.getElementById('label-current-game');

        async function refreshCurrentGame() {
            try {
                const res = await fetch('/api/current');
                const data = await res.json();
                labelCurrentGame.textContent = data.current || 'DragonBoy250.jar';
            } catch (e) {
                labelCurrentGame.textContent = 'DragonBoy250.jar';
            }
        }

        btnOpenUpload.addEventListener('click', () => {
            refreshCurrentGame();
            uploadStatus.classList.add('hidden');
            inputGameFile.value = '';
            modalUpload.classList.remove('hidden');
        });

        btnCloseUpload.addEventListener('click', () => modalUpload.classList.add('hidden'));
        btnCancelUpload.addEventListener('click', () => modalUpload.classList.add('hidden'));

        btnSubmitUpload.addEventListener('click', async () => {
            if (!inputGameFile.files || inputGameFile.files.length === 0) {
                uploadStatus.className = 'text-center py-1 text-xs text-rose-400';
                uploadStatus.textContent = 'Vui lòng chọn 1 file .jar!';
                uploadStatus.classList.remove('hidden');
                return;
            }

            const file = inputGameFile.files[0];
            if (!file.name.toLowerCase().endsWith('.jar')) {
                uploadStatus.className = 'text-center py-1 text-xs text-rose-400';
                uploadStatus.textContent = 'Chỉ chấp nhận file có đuôi .jar!';
                uploadStatus.classList.remove('hidden');
                return;
            }

            uploadStatus.className = 'text-center py-1 text-xs text-amber-300 animate-pulse';
            uploadStatus.textContent = 'Đang tải lên và khởi động lại game...';
            uploadStatus.classList.remove('hidden');
            btnSubmitUpload.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    uploadStatus.className = 'text-center py-1 text-xs text-emerald-400 font-semibold';
                    uploadStatus.textContent = `Thành công! Đang chuyển sang ${data.filename}...`;
                    setTimeout(() => {
                        modalUpload.classList.add('hidden');
                        btnSubmitUpload.disabled = false;
                    }, 1500);
                } else {
                    uploadStatus.className = 'text-center py-1 text-xs text-rose-400';
                    uploadStatus.textContent = data.error || 'Lỗi tải file!';
                    btnSubmitUpload.disabled = false;
                }
            } catch (err) {
                uploadStatus.className = 'text-center py-1 text-xs text-rose-400';
                uploadStatus.textContent = 'Lỗi mạng khi tải lên!';
                btnSubmitUpload.disabled = false;
            }
        });
    </script>
</body>
</html>
