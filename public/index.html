<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Rồng Online • 24/7 Cloud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            margin: 0;
            padding: 0;
            background: #070a12;
            overflow: hidden;
            touch-action: none;
        }
        #screen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        #screen canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            border-radius: 12px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .btn-ctrl {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            transition: all 0.12s ease;
        }
        .btn-ctrl:active {
            background: #3b82f6;
            color: #ffffff;
            transform: scale(0.94);
            border-color: #60a5fa;
        }
        /* Hide all default noVNC toolbars & icons */
        .noVNC_vcenter, #noVNC_control_bar_anchor, #noVNC_control_bar {
            display: none !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none text-slate-100">

    <!-- Sleek Minimalist Top Navbar -->
    <header class="h-12 bg-slate-950/80 backdrop-blur-md border-b border-white/5 px-4 flex items-center justify-between z-30 shrink-0">
        <!-- Brand & Status -->
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-amber-500/20 text-white text-xs font-bold">
                🐉
            </div>
            <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-slate-100 tracking-tight">Ngọc Rồng Online</span>
                <span id="status-pill" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="status-label">Đang kết nối...</span>
                </span>
            </div>
        </div>

        <!-- Modern Action Buttons -->
        <div class="flex items-center gap-2">
            <button id="btn-toggle-pad" class="h-8 px-3 rounded-lg bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 text-xs font-medium text-slate-200 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-gamepad text-amber-400"></i>
                <span class="hidden sm:inline">Phím ảo</span>
            </button>
            <button id="btn-fullscreen" class="h-8 w-8 rounded-lg bg-white/5 hover:bg-white/10 active:scale-95 border border-white/10 text-xs text-slate-300 flex items-center justify-center transition" title="Toàn màn hình">
                <i class="fa-solid fa-expand"></i>
            </button>
            <a href="/health" target="_blank" class="h-8 px-2.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-xs font-medium text-rose-400 flex items-center gap-1.5 transition" title="UptimeRobot Health Check">
                <i class="fa-solid fa-heart-pulse"></i>
                <span class="hidden md:inline">24/7 Keep-Alive</span>
            </a>
        </div>
    </header>

    <!-- Main Game Canvas Area -->
    <main class="relative flex-1 bg-[#070a12] flex items-center justify-center p-2 sm:p-4 overflow-hidden">
        <div id="screen" class="w-full h-full"></div>

        <!-- Loading / Connecting Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#070a12]/95 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-opacity duration-300 z-20">
            <div class="relative w-12 h-12">
                <div class="w-12 h-12 rounded-full border-2 border-amber-500/20 border-t-amber-400 animate-spin"></div>
                <span class="absolute inset-0 flex items-center justify-center text-sm">🐉</span>
            </div>
            <p class="text-xs font-medium text-slate-300" id="loading-text">Đang kết nối vào màn hình Ngọc Rồng 24/24...</p>
        </div>

        <!-- Minimalist Floating Mobile Keypad -->
        <div id="gamepad-drawer" class="hidden absolute bottom-4 right-4 bg-slate-950/85 backdrop-blur-xl p-3 rounded-2xl border border-white/10 shadow-2xl z-40 max-w-[260px] animate-in fade-in zoom-in-95 duration-150">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/10 text-[11px] font-semibold text-slate-400">
                <span class="flex items-center gap-1.5 text-amber-400">
                    <i class="fa-solid fa-keyboard"></i>
                    <span>Bàn phím J2ME</span>
                </span>
                <button id="btn-close-pad" class="text-slate-400 hover:text-white p-0.5">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <!-- Direction & Softkeys -->
            <div class="grid grid-cols-3 gap-1.5 mb-2 text-xs">
                <button class="btn-ctrl h-9 text-[11px]" data-key="SoftLeft">Chọn Trái</button>
                <button class="btn-ctrl h-9" data-key="ArrowUp"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="btn-ctrl h-9 text-[11px]" data-key="SoftRight">Chọn Phải</button>

                <button class="btn-ctrl h-9" data-key="ArrowLeft"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="btn-ctrl h-9 bg-indigo-600/80 border-indigo-500 font-bold text-white" data-key="Enter">OK</button>
                <button class="btn-ctrl h-9" data-key="ArrowRight"><i class="fa-solid fa-arrow-right"></i></button>

                <div></div>
                <button class="btn-ctrl h-9" data-key="ArrowDown"><i class="fa-solid fa-arrow-down"></i></button>
                <div></div>
            </div>

            <!-- Number Keypad (1 - 9, *, 0, #) -->
            <div class="grid grid-cols-3 gap-1.5 text-xs">
                <button class="btn-ctrl h-8" data-key="1">1</button>
                <button class="btn-ctrl h-8" data-key="2">2</button>
                <button class="btn-ctrl h-8" data-key="3">3</button>
                <button class="btn-ctrl h-8" data-key="4">4</button>
                <button class="btn-ctrl h-8" data-key="5">5</button>
                <button class="btn-ctrl h-8" data-key="6">6</button>
                <button class="btn-ctrl h-8" data-key="7">7</button>
                <button class="btn-ctrl h-8" data-key="8">8</button>
                <button class="btn-ctrl h-8" data-key="9">9</button>
                <button class="btn-ctrl h-8 font-bold text-amber-400" data-key="*">*</button>
                <button class="btn-ctrl h-8" data-key="0">0</button>
                <button class="btn-ctrl h-8 font-bold text-amber-400" data-key="#">#</button>
            </div>
        </div>
    </main>

    <!-- RFB Core Library Script -->
    <script type="module">
        import RFB from './core/rfb.js';

        let rfb = null;
        const screenElem = document.getElementById('screen');
        const statusPill = document.getElementById('status-pill');
        const statusLabel = document.getElementById('status-label');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        function connect() {
            loadingOverlay.style.opacity = '1';
            loadingOverlay.classList.remove('pointer-events-none');
            loadingText.textContent = 'Đang kết nối vào máy chủ game...';

            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const port = window.location.port ? `:${window.location.port}` : '';
            const path = 'websockify';
            const url = `${protocol}://${window.location.hostname}${port}/${path}`;

            try {
                rfb = new RFB(screenElem, url, {
                    credentials: { password: '' }
                });

                rfb.scaleViewport = true;
                rfb.resizeSession = false;
                rfb.clipViewport = true;
                rfb.qualityLevel = 8;
                rfb.compressionLevel = 2;

                rfb.addEventListener('connect', () => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => loadingOverlay.classList.add('pointer-events-none'), 300);
                    statusPill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                    statusLabel.textContent = 'Đang chạy 24/24';
                });

                rfb.addEventListener('disconnect', (e) => {
                    loadingOverlay.style.opacity = '1';
                    loadingOverlay.classList.remove('pointer-events-none');
                    loadingText.textContent = 'Mất kết nối. Đang tự động kết nối lại...';
                    statusPill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
                    statusLabel.textContent = 'Đã ngắt';
                    setTimeout(connect, 2000);
                });

            } catch (err) {
                loadingText.textContent = 'Lỗi kết nối: ' + err.message;
                setTimeout(connect, 3000);
            }
        }

        // Initialize RFB connection
        connect();

        // Virtual Keypad Action Handlers
        const keysymMap = {
            'ArrowUp': 0xFF52,
            'ArrowDown': 0xFF54,
            'ArrowLeft': 0xFF51,
            'ArrowRight': 0xFF53,
            'Enter': 0xFF0D,
            'SoftLeft': 0xFF6A,
            'SoftRight': 0xFF6B,
            '1': 0x0031, '2': 0x0032, '3': 0x0033,
            '4': 0x0034, '5': 0x0035, '6': 0x0036,
            '7': 0x0037, '8': 0x0038, '9': 0x0039,
            '0': 0x0030, '*': 0x002A, '#': 0x0023
        };

        document.querySelectorAll('.btn-ctrl').forEach(btn => {
            const sendKey = (isDown) => {
                const key = btn.getAttribute('data-key');
                const sym = keysymMap[key];
                if (rfb && sym) {
                    rfb.sendKey(sym, null, isDown);
                }
            };
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); sendKey(true); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); sendKey(false); });
            btn.addEventListener('pointerleave', (e) => { sendKey(false); });
        });

        // Toggle Keypad Drawer
        const btnTogglePad = document.getElementById('btn-toggle-pad');
        const gamepadDrawer = document.getElementById('gamepad-drawer');
        const btnClosePad = document.getElementById('btn-close-pad');

        btnTogglePad.addEventListener('click', () => gamepadDrawer.classList.toggle('hidden'));
        btnClosePad.addEventListener('click', () => gamepadDrawer.classList.add('hidden'));

        // Fullscreen toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
    </script>
</body>
</html>
