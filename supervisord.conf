[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 240x360x24 -ac -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:emulator]
command=/bin/bash /app/scripts/start_emu.sh
environment=DISPLAY=":1"
priority=20
autorestart=true
stdout_logfile=/var/log/emulator.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/emulator_err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[program:web]
command=gunicorn -w 1 --threads 4 -b 0.0.0.0:%(ENV_PORT)s app.server:app
environment=DISPLAY=":1",PORT="8080"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
